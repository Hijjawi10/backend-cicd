name: Trigger Control-M Deployment

on:
  pull_request:
    branches:
      - development
    types:
      - closed

permissions:
  contents: read

jobs:
  trigger-controlm:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      CTM_ENDPOINT: https://partners-emea-aapi.us1.controlm.com/automation-api
      CTM_API_TOKEN: ${{ secrets.CTM_API_TOKEN }}

    steps:
      - name: Start Control-M workflow
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CTM_API_TOKEN" ]; then
            echo "Missing GitHub secret: CTM_API_TOKEN"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 90 \
            --request POST \
            --header "x-api-key: $CTM_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "ctm": "IN01",
              "folder": "FDS_Jenkins",
              "hold": "false",
              "ignoreCriteria": "true",
              "independentFlow": "true",
              "orderIntoFolder": "New"
            }' \
            "$CTM_ENDPOINT/run/order" \
            --output response.json

          python3 - <<'PY'
          import json

          with open("response.json", encoding="utf-8") as file:
              result = json.load(file)

          if result.get("errors") or not result.get("runId"):
              raise SystemExit(
                  f"Control-M rejected the request: {result}"
              )

          print("Control-M accepted the run.")
          print("runId:", result["runId"])
          PY